<!DOCTYPE html>
<html>
<head>
    <title>NIDS Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav style="background:#0d6efd;padding:15px;">
    <a href="/" style="color:white;margin-right:20px;">Home</a>
    <a href="/loginpage" style="color:white;margin-right:20px;">Login</a>
    <a href="/registerpage" style="color:white;margin-right:20px;">Register</a>
    <a href="/dashboard" style="color:white;">Dashboard</a>
</nav>

<h1>NIDS Login</h1>

<form id ="loginForm" style="width:300px;margin:auto;">
    <input type="text" id="username" placeholder="Username" style="width:100%;padding:10px;margin:10px 0;"><br>

    <input type="password" id="password" placeholder="Password" style="width:100%;padding:10px;margin:10px 0;"><br>

    <button type="submit" style="width:100%;padding:10px;">Login</button>
</form>

<script>
document.getElementById("loginForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    const response = await fetch("/login", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            username: username,
            password: password
        })
    });

    const data = await response.json();

    alert(data.message);

    if (response.ok) {
        window.location.href = "/";
    }
});
</script>
</body>
</html>
